[project]
name = "learn-english-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "jsonschema>=4.22",
  "pypdf>=5.0",
  "google-genai>=1.0",
  "edge-tts>=7.0",
  "pytest>=8.0",
]

[project.scripts]
studio = "studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]