[project]
name = "learn-english-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.6.0",
    "fastapi>=0.163.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.26.0",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
